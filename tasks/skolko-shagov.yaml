title: "Сколько шагов до нуля"
chapter: "04_upravlenie_potokom"
section: "4.5"
book_url: "https://imiron.ru/1c-razgovornik/chapters/04_upravlenie_potokom/04-05_cikl_poka.html"
difficulty: medium
tags: ["цикл Пока", "счётчик"]
statement: |
  Из остатка `Старт` раз за разом вычитают `Шаг`, пока остаток не станет
  меньше или равен нулю. Напиши функцию `СколькоШагов(Старт, Шаг)` —
  сколько вычитаний для этого понадобится.

  `СколькоШагов(100, 30)` — это 4: остаток идёт 70, 40, 10 и наконец −20.
  Последний шаг проскакивает ноль, но он тоже считается.

  Если стартовый остаток уже не больше нуля, шагов не нужно вовсе.
starter: |
  Функция СколькоШагов(Старт, Шаг) Экспорт
      // Твой код
  КонецФункции
hints:
  - "Заведи счётчик рядом с остатком и увеличивай его в теле цикла."
  - "Условие `Пока` проверяется перед каждым проходом — если оно ложно сразу, тело не выполнится ни разу."
tests:
  - kind: call
    name: "сто по тридцать"
    invoke: "СколькоШагов(100, 30)"
    expect: "4"
  - kind: call
    name: "делится нацело"
    invoke: "СколькоШагов(100, 25)"
    expect: "4"
  - kind: call
    name: "шаг больше остатка"
    invoke: "СколькоШагов(10, 50)"
    expect: "1"
  - kind: call
    name: "стартовать не с чего"
    invoke: "СколькоШагов(0, 5)"
    expect: "0"
    hidden: true
