title: "Первые пять чётных"
chapter: "04_upravlenie_potokom"
section: "4.3"
book_url: "https://imiron.ru/1c-razgovornik/chapters/04_upravlenie_potokom/04-03_cikl_dlya_po.html"
difficulty: intro
tags: ["цикл", "счётчик", "вывод"]
statement: |
  Выведи через `Сообщить` первые пять чётных чисел — каждое отдельной строкой.

  Ожидаемый вывод:

      2
      4
      6
      8
      10

  Считать до десяти и отсеивать нечётные не нужно: пяти проходов достаточно,
  если на каждом выводить удвоенный счётчик.
starter: |
  Для Сч = 1 По 5 Цикл
      // Твой код
  КонецЦикла;
hints:
  - "На проходе номер Сч нужно вывести Сч * 2."
tests:
  - kind: stdout
    name: "пять чисел по порядку"
    expect: |-
      2
      4
      6
      8
      10
