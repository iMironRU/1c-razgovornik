title: "Сумма чисел из строки"
chapter: "03_kollektsii"
section: "3.1"
book_url: "https://imiron.ru/1c-razgovornik/chapters/03_kollektsii/03-01_massiv.html"
difficulty: easy
tags: ["массив", "цикл по коллекции", "преобразование типов"]
statement: |
  Напиши функцию `СуммаСписка(Перечень)`. На вход приходит строка вида
  `"1,2,3"` — числа через запятую. Функция возвращает их сумму.

  Разбить строку на части поможет `СтрРазделить(Перечень, ",")` — она
  возвращает **массив**. Но элементы в нём строковые, и складывать их
  напрямую нельзя: `"1" + "2"` даст `"12"`, а не `3`. Каждую часть нужно
  превратить в число функцией `Число()`.

  Пустая строка даёт 0.
starter: |
  Функция СуммаСписка(Перечень) Экспорт
      // Твой код
  КонецФункции
hints:
  - "`Части = СтрРазделить(Перечень, \",\");` — дальше обходи массив через `Для Каждого`."
  - "Пустая строка при разделении даёт массив из одной пустой части — её нужно отсеять."
tests:
  - kind: call
    name: "три числа"
    invoke: "СуммаСписка(\"1,2,3\")"
    expect: "6"
  - kind: call
    name: "одно число"
    invoke: "СуммаСписка(\"42\")"
    expect: "42"
  - kind: call
    name: "пустая строка"
    invoke: "СуммаСписка(\"\")"
    expect: "0"
  - kind: call
    name: "с отрицательными"
    invoke: "СуммаСписка(\"-5,5,10\")"
    expect: "10"
    hidden: true
