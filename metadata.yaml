# ─────────────────────────────────────────────
# ИДЕНТИФИКАЦИЯ КНИГИ
# ─────────────────────────────────────────────
title: "1С-разговорник"
subtitle: "Для тех, кто переходит с других языков"
author: "Александр Мирошниченко"
author_url: "https://github.com/iMironRU"
language: ru
license: "CC BY 4.0"

version: "0.2.0"

# Стабильный слаг книги для BSLexicon — не меняется при переименовании репозитория
book_id: "1c-razgovornik"

# ─────────────────────────────────────────────
# ОТСЛЕЖИВАНИЕ ШАБЛОНА
# ─────────────────────────────────────────────
template_repo: "https://github.com/iMironRU/book-template"
template_version: "v0.2.1"

# ─────────────────────────────────────────────
# ФОРМАТЫ ВЫПУСКА
# ─────────────────────────────────────────────
formats:
  epub:     true
  fb2:      true
  pdf_a5:   true
  pdf_a4:   false
  html:     true
  docx:     true
  docx_a4:  false
  site:     true    # Сайт на GitHub Pages (mdBook)
release_filter: "review"
nightly_filter: "all"

# ─────────────────────────────────────────────
# ДОПОЛНИТЕЛЬНЫЕ АРТЕФАКТЫ
# ─────────────────────────────────────────────
artifacts: []

# ─────────────────────────────────────────────
# САЙТ (GitHub Pages)
# ─────────────────────────────────────────────
site_url: "https://imiron.ru/1c-razgovornik/"

# ─────────────────────────────────────────────
# НОЧНЫЕ СБОРКИ
# ─────────────────────────────────────────────
nightly:
  enabled: true
  branch: "main"

# ─────────────────────────────────────────────
# PDF — ПАРАМЕТРЫ СТРАНИЦЫ
# ─────────────────────────────────────────────
pdf:
  font_main: "PT Serif"
  font_mono: "JetBrains Mono"
  font_size: "11pt"
  margin_a5: "top=20mm,right=15mm,bottom=20mm,left=20mm"
  margin_a4: "top=25mm,right=20mm,bottom=25mm,left=25mm"

# ─────────────────────────────────────────────
#  НАЗВАНИЯ ГЛАВ (заголовки разделов в SUMMARY)
# ─────────────────────────────────────────────
modules:
  00_predislovie: "Глава 0. Предисловие"
  01_priroda_yazyka: "Глава 1. Природа языка"
  02_peremennye_i_tipy: "Глава 2. Переменные и примитивные типы"
  03_kollektsii: "Глава 3. Коллекции"
  04_upravlenie_potokom: "Глава 4. Управление потоком"
  05_procedury_i_funkcii: "Глава 5. Процедуры и функции"
  06_obrabotka_oshibok: "Глава 6. Обработка ошибок"
  07_asinhronnost: "Глава 7. Асинхронность"
  08_obekty: "Глава 8. Объекты вместо классов"
